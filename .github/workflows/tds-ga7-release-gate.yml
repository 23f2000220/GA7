name: TDS GA7 Release Gate

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "TDS identity: 23f2000220@ds.study.iitm.ac.in"
        run: |
          echo "TDS identity: 23f2000220@ds.study.iitm.ac.in"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run release-gate tests
        run: python3 -m pytest test_main.py -k release_gate -v
